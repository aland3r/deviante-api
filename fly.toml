# Fly.io deployment config for Deviante API (Kotlin + Ktor)
app = "deviante-api"
primary_region = "sa-east-1"

[build]
  image = "eclipse-temurin:21-jdk"

[env]
  # Application configuration
  DATABASE_JDBC_URL = "postgresql://db.ydjtrcjxhtmygytmebrk.supabase.co:5432/postgres"
  KTOR_ENVIRONMENT = "production"

[services]
  [[services.ports]]
    handlers = ["http"]
    port = 8080
    force_https = false

  [services.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

  [[services.tcp_checks]]
    grace_period = "5s"
    interval = "15s"
    timeout = "2s"
    port = 8080

[checks]
  [checks.status]
    type = "http"
    port = 8080
    interval = "15s"
    timeout = "5s"
    path = "/ping"

[processes]
  api = "./gradlew run"
