app = "deviante-api"
primary_region = "sa-east-1"

[build]
  image = "eclipse-temurin:21-jdk"

[[services]]
  protocol = "tcp"
  internal_port = 8080
  processes = ["api"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
    force_https = true

  [services.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

[processes]
  api = "./gradlew run"

[checks]
  [checks.status]
    type = "http"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    path = "/ping"
